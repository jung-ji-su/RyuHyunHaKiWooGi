<!--
  PROTOTYPE — dress-preview.html
  버리는 코드입니다. 실제 앱(src/)은 전혀 건드리지 않았습니다.

  1라운드(픽셀 vs 벡터)에서 벡터로 결정됨. 이번 라운드 질문:
  "벡터 햄스터를 더 귀엽고 디테일하게, 그리고 방향이 다른 3종 중
  뭘로 갈지?" — 같은 상점/꾸미기/구경하기 화면 위에서 하단 바로
  전환해가며 비교합니다.

  캐릭터는 head/body/ear/cheek/eye/paw/foot 좌표를 headR(머리 반지름)
  기준 비율로 전부 계산하는 "앵커" 시스템으로 다시 짰습니다 — 1라운드의
  버그(상의가 얼굴을 덮음, 모자가 머리에 안 붙음)는 좌표를 하드코딩해서
  생긴 문제라, 이번엔 전부 getAnchors()가 계산한 기준점을 슬롯 아이템이
  참조하는 구조로 바꿨습니다.

  state는 전부 메모리에만 있음(새로고침하면 초기화). 저장/API/테스트 없음.
  하단 플로팅 바: ← 동글이 / 볼빵빵이 / 아기눈이 → 로 전환, URL의
  ?variant=·?tab= 에 반영되어 새로고침해도 유지됩니다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PROTOTYPE · 햄찌 꾸미기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
  :root {
    --c-pants: #7B4FA6;
    --c-accent: #E8630A;
    --c-dark: #3D1F00;
    --c-skin: #F5B8A0;
    --c-cream: #FFF8F2;
    --c-peach: #FFE4D4;
    --c-lavender: #EDE0F5;
    --c-pink: #FF8FAB;
    --c-pink-vivid: #FF6B9D;
    --c-success: #1D9E75;
    --c-warning: #FFB830;
    --c-surface: #FFFFFF;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #E8E2EE;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--c-dark);
  }
  img, svg { max-width: 100%; }

  /* ── 프로토타입 표시 ─────────────────────────────────────────── */
  .proto-ribbon {
    position: fixed; top: 0; left: 0; right: 0; z-index: 500;
    background: repeating-linear-gradient(135deg, #222 0 10px, #FFD700 10px 20px);
    color: #111; font-family: 'Noto Sans KR', sans-serif; font-weight: 900;
    font-size: 11px; text-align: center; padding: 3px 0;
    letter-spacing: 0.04em;
  }
  .proto-ribbon b { background: #fff; padding: 0 6px; border-radius: 4px; }

  /* ── 폰 프레임 ───────────────────────────────────────────────── */
  .stage {
    min-height: 100vh; display: flex; justify-content: center;
    padding: 26px 0 100px;
  }
  .phone {
    width: 402px; max-width: 100vw; min-height: 874px;
    background: var(--c-cream);
    background-image: radial-gradient(circle at 85% 0%, var(--c-lavender) 0%, transparent 40%);
    position: relative; overflow: hidden;
    box-shadow: 0 30px 70px rgba(61,31,0,0.25);
    display: flex; flex-direction: column;
  }

  /* ── 상단 바 ─────────────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px;
  }
  .topbar .title {
    font-family: 'Jua', sans-serif; font-size: 1.05rem; color: var(--c-pants);
    display: flex; align-items: center; gap: 6px;
  }
  .coin-pill {
    display: flex; align-items: center; gap: 4px;
    background: #fff; border: 1.5px solid #FFD70088; border-radius: 999px;
    padding: 4px 10px 4px 6px;
    box-shadow: 0 2px 8px rgba(123,79,166,0.12);
    font-family: 'Jua', sans-serif; font-size: 0.85rem; color: #B8860B;
  }
  .style-chip {
    font-size: 0.62rem; font-weight: 700; color: var(--c-pants);
    background: var(--c-lavender); border-radius: 999px; padding: 2px 9px;
    font-family: 'Noto Sans KR', sans-serif;
  }

  /* ── 탭 ──────────────────────────────────────────────────────── */
  .tabs {
    display: flex; gap: 6px; padding: 0 14px 10px;
  }
  .tab-btn {
    flex: 1; border: none; cursor: pointer; padding: 9px 4px;
    border-radius: 12px; font-family: 'Jua', sans-serif; font-size: 0.82rem;
    background: transparent; color: #B7ABC4;
    transition: background-color .15s, color .15s;
  }
  .tab-btn.active { background: #fff; color: var(--c-pants); box-shadow: 0 3px 10px rgba(123,79,166,0.16); }

  .view { flex: 1; overflow-y: auto; padding: 0 14px 16px; -webkit-overflow-scrolling: touch; }
  .view::-webkit-scrollbar { display: none; }

  /* ── 캐릭터 프리뷰 공통 ──────────────────────────────────────── */
  .stage-box {
    position: relative; border-radius: 20px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1.5px rgba(123,79,166,0.12);
    cursor: pointer;
  }
  .fx-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .fx-item { position: absolute; bottom: 8%; font-size: 1rem; opacity: 0; animation: fxFloat 2.2s ease-in infinite; }
  @keyframes fxFloat {
    0%   { opacity: 0; transform: translateY(0) scale(0.6); }
    15%  { opacity: 1; }
    85%  { opacity: 0.9; }
    100% { opacity: 0; transform: translateY(-120%) scale(1.1); }
  }
  .fx-rainbow-arc {
    position: absolute; left: 50%; top: 6%; width: 78%; aspect-ratio: 2/1;
    transform: translateX(-50%);
    border-radius: 999px 999px 0 0;
    border: 6px solid transparent;
    border-top-color: #FF6B9D;
    background:
      conic-gradient(from 180deg at 50% 100%,
        #FF6B6B 0deg 51deg, #FFD93D 51deg 102deg, #6BCB77 102deg 153deg,
        #4D96FF 153deg 204deg, #9B59B6 204deg 255deg, transparent 255deg 360deg);
    -webkit-mask: radial-gradient(farthest-side at 50% 100%, transparent calc(100% - 7px), #000 calc(100% - 7px));
            mask: radial-gradient(farthest-side at 50% 100%, transparent calc(100% - 7px), #000 calc(100% - 7px));
    opacity: 0.9;
  }

  /* ── 캐릭터 애니메이션(살아있는 느낌) ──────────────────────────
     transform-box: fill-box 없으면 SVG 자식 요소의 transform-origin이
     뷰포트 기준으로 잡혀서 엉뚱한 지점을 축으로 돌아간다. */
  .hm-eye { transform-box: fill-box; transform-origin: center; }
  .hm-bounce-target { transform-box: fill-box; transform-origin: 50% 100%; }
  @media (prefers-reduced-motion: no-preference) {
    .hm-breathe { animation: hmBreathe 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .hm-eye { animation: hmBlink 5.4s ease-in-out infinite; animation-delay: var(--blink-delay, 0s); }
  }
  @keyframes hmBreathe {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(1.018) translateY(-0.4%); }
  }
  @keyframes hmBlink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.12); }
  }
  .hm-tap-jump { animation: hmTapJump 0.55s cubic-bezier(.34,1.56,.64,1) 1; }
  @keyframes hmTapJump {
    0%   { transform: scale(1,1) translateY(0) rotate(0deg); }
    30%  { transform: scale(1.06,0.9) translateY(2%) rotate(0deg); }
    60%  { transform: scale(0.95,1.08) translateY(-10%) rotate(-4deg); }
    80%  { transform: scale(1.02,0.97) translateY(2%) rotate(3deg); }
    100% { transform: scale(1,1) translateY(0) rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hm-tap-jump { animation: hmTapTiny 0.25s ease-out 1; }
  }
  @keyframes hmTapTiny {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }

  /* ── 상점 ────────────────────────────────────────────────────── */
  .slot-filters { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 12px; }
  .slot-filters::-webkit-scrollbar { display: none; }
  .slot-chip {
    flex-shrink: 0; border: 1.5px solid var(--c-lavender); background: #fff;
    border-radius: 999px; padding: 6px 12px; font-size: 0.72rem; font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif; color: var(--c-pants); cursor: pointer;
    display: flex; align-items: center; gap: 4px;
    transition: background-color .15s, border-color .15s, color .15s;
  }
  .slot-chip.active { background: var(--c-pants); border-color: var(--c-pants); color: #fff; }

  .shop-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .item-card {
    background: #fff; border-radius: 16px; padding: 10px;
    box-shadow: 0 3px 14px rgba(123,79,166,0.10);
    border: 1.5px solid rgba(123,79,166,0.08);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    position: relative;
  }
  .item-card .swatch {
    width: 56px; height: 56px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem;
  }
  .item-card .name { font-size: 0.74rem; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; text-align: center; line-height: 1.3; }
  .item-card .price { font-size: 0.72rem; color: #B8860B; font-family: 'Jua', sans-serif; display: flex; align-items: center; gap: 3px; }
  .buy-btn {
    width: 100%; border: none; border-radius: 999px; padding: 6px 0;
    font-family: 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 0.7rem;
    cursor: pointer; background: var(--c-pants); color: #fff;
    transition: transform .1s, opacity .15s;
  }
  .buy-btn:active { transform: scale(0.95); }
  .buy-btn[disabled] { background: #EADFF2; color: #B7ABC4; cursor: default; }
  .owned-badge {
    position: absolute; top: 8px; right: 8px; background: var(--c-success); color: #fff;
    font-size: 0.6rem; font-weight: 700; border-radius: 999px; padding: 2px 7px;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: rgba(61,31,0,0.92); color: #fff; padding: 9px 16px; border-radius: 999px;
    font-size: 0.78rem; font-family: 'Noto Sans KR', sans-serif; font-weight: 700;
    z-index: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  /* ── 꾸미기 ──────────────────────────────────────────────────── */
  .dress-preview-wrap { display: flex; justify-content: center; padding: 6px 0 10px; }
  .tap-hint { text-align: center; font-size: 0.64rem; color: #B7ABC4; font-family: 'Noto Sans KR', sans-serif; margin-bottom: 10px; }
  .slot-tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 10px; }
  .slot-tabs::-webkit-scrollbar { display: none; }
  .slot-tab {
    flex-shrink: 0; border: none; background: #fff; border-radius: 12px;
    padding: 7px 10px; font-size: 1.05rem; cursor: pointer;
    box-shadow: 0 2px 8px rgba(123,79,166,0.08);
    opacity: 0.55;
  }
  .slot-tab.active { opacity: 1; background: var(--c-pants); }
  .option-row { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 14px; }
  .option-row::-webkit-scrollbar { display: none; }
  .option-chip {
    flex-shrink: 0; width: 74px; display: flex; flex-direction: column; align-items: center; gap: 5px;
    cursor: pointer; opacity: 1;
  }
  .option-chip .ring {
    width: 58px; height: 58px; border-radius: 16px; background: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
    border: 2.5px solid transparent; box-shadow: 0 3px 10px rgba(123,79,166,0.10);
    position: relative;
  }
  .option-chip.selected .ring { border-color: var(--c-pants); }
  .option-chip.locked .ring { opacity: 0.4; }
  .option-chip .lock { position: absolute; bottom: -3px; right: -3px; font-size: 0.7rem; background: #fff; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
  .option-chip .lbl { font-size: 0.62rem; font-family: 'Noto Sans KR', sans-serif; color: var(--c-dark); text-align: center; line-height: 1.2; }

  .color-demo {
    margin-top: 2px; padding: 10px 12px; border-radius: 14px;
    background: #fff; border: 1.5px dashed var(--c-pink-vivid);
  }
  .color-demo .ttl { font-size: 0.68rem; font-weight: 700; color: var(--c-pink-vivid); font-family: 'Noto Sans KR', sans-serif; margin-bottom: 6px; }
  .swatch-row { display: flex; gap: 8px; }
  .color-dot { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2.5px solid transparent; }
  .color-dot.selected { border-color: var(--c-dark); }

  .fur-demo {
    margin: 10px 0 2px; padding: 10px 12px; border-radius: 14px;
    background: #fff; border: 1.5px solid rgba(123,79,166,0.14);
  }
  .fur-demo .ttl { font-size: 0.68rem; font-weight: 700; color: var(--c-pants); font-family: 'Noto Sans KR', sans-serif; margin-bottom: 6px; }

  /* ── 구경하기 ────────────────────────────────────────────────── */
  .compare-wrap { display: flex; gap: 10px; padding-top: 4px; }
  .compare-card { flex: 1; background: #fff; border-radius: 18px; padding: 12px 8px; box-shadow: 0 4px 16px rgba(123,79,166,0.12); text-align: center; }
  .compare-card .name { font-family: 'Jua', sans-serif; font-size: 0.85rem; color: var(--c-pants); margin: 8px 0 2px; }
  .compare-card .sub { font-size: 0.64rem; color: #B7ABC4; font-family: 'Noto Sans KR', sans-serif; }

  .hint-box {
    margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: rgba(123,79,166,0.06);
    font-size: 0.68rem; color: #8A7B9B; font-family: 'Noto Sans KR', sans-serif; line-height: 1.6;
  }

  /* ── 하단 변형 전환 플로팅 바 (프로토타입 전용 — 실제 UI 아님) ── */
  .switcher {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 550; display: flex; align-items: center; gap: 10px;
    background: #16121F; color: #fff; border-radius: 999px;
    padding: 8px 10px 8px 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    font-family: 'Noto Sans KR', sans-serif;
  }
  .switcher button {
    border: none; background: #2A2338; color: #fff; width: 30px; height: 30px; border-radius: 50%;
    font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .switcher button:active { transform: scale(0.9); }
  .switcher .label { font-size: 0.78rem; font-weight: 700; min-width: 108px; text-align: center; }
  .switcher .label small { display: block; font-size: 0.6rem; font-weight: 400; opacity: 0.65; margin-top: 1px; }
</style>
</head>
<body>

<div class="proto-ribbon">🧪 PROTOTYPE — <b>앱에 반영 안 됨</b> · dress-preview.html · 버리는 코드</div>
<div id="toast" class="toast"></div>

<div class="stage">
  <div class="phone" style="margin-top: 22px;">
    <div class="topbar">
      <div class="title">🐹 햄찌 꾸미기</div>
      <div style="display:flex; align-items:center; gap:6px;">
        <span class="style-chip" id="styleChip">동글이</span>
        <span class="coin-pill">🪙 <span id="coinLabel">0</span></span>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn" data-tab="shop">🛍️ 상점</button>
      <button class="tab-btn" data-tab="dress">🧢 꾸미기</button>
      <button class="tab-btn" data-tab="compare">👀 구경하기</button>
    </div>

    <div class="view" id="view"></div>
  </div>
</div>

<div class="switcher">
  <button id="prevStyle" aria-label="이전 변형">←</button>
  <div class="label" id="switcherLabel">동글이<small>기본형</small></div>
  <button id="nextStyle" aria-label="다음 변형">→</button>
</div>

<script>
/* ============================================================
   상태 (메모리에만 존재 — 새로고침하면 초기화됨, 더미 데이터)
   ============================================================ */
const SLOTS = [
  { key:'hat',     label:'모자',    icon:'🎩' },
  { key:'glasses', label:'선글라스', icon:'🕶️' },
  { key:'gloves',  label:'장갑',    icon:'🧤' },
  { key:'shoes',   label:'신발',    icon:'👟' },
  { key:'top',     label:'옷',      icon:'👕' },
  { key:'bottom',  label:'바지',    icon:'👖' },
  { key:'bg',      label:'배경',    icon:'🖼️' },
  { key:'effect',  label:'이펙트',  icon:'✨' },
];

const ITEMS = [
  { id:'hat_ribbon',  slot:'hat',     name:'리본 모자',   price:40,  color:'#EDE0F5', accent:'#7B4FA6', icon:'🎀' },
  { id:'hat_crown',   slot:'hat',     name:'왕관',        price:120, color:'#FFD700', accent:'#E8630A', icon:'👑' },
  { id:'hat_cap',     slot:'hat',     name:'야구모자',     price:30,  color:'#FFB380', accent:'#ffffff', icon:'🧢' },

  { id:'gl_round',    slot:'glasses', name:'동그란 안경',  price:20,  color:'#333333', icon:'⚫' },
  { id:'gl_heart',    slot:'glasses', name:'하트 안경',    price:35,  color:'#FF6B9D', icon:'💗' },
  { id:'gl_star',     slot:'glasses', name:'별 안경',      price:35,  color:'#7B4FA6', icon:'⭐' },

  { id:'gv_white',    slot:'gloves',  name:'하얀 장갑',    price:15,  color:'#FFFFFF', icon:'🤍' },
  { id:'gv_boxing',   slot:'gloves',  name:'복서 글러브',  price:45,  color:'#FF6B9D', icon:'🥊' },
  { id:'gv_mitt',     slot:'gloves',  name:'야구 글러브',  price:45,  color:'#B87333', icon:'🧤' },

  { id:'sh_blue',     slot:'shoes',   name:'파랑 운동화',  price:25,  color:'#3B82F6', icon:'👟' },
  { id:'sh_pink',     slot:'shoes',   name:'핑크 운동화',  price:25,  color:'#FF8FAB', icon:'👟' },
  { id:'sh_boots',    slot:'shoes',   name:'가죽 부츠',    price:50,  color:'#8B5E34', icon:'🥾' },

  { id:'top_tee',     slot:'top',     name:'티셔츠',       price:30,  color:'#EDE0F5', icon:'👕', colorable:true },
  { id:'top_hoodie',  slot:'top',     name:'후드티',       price:55,  color:'#FFE4D4', icon:'🧥' },
  { id:'top_overall', slot:'top',     name:'멜빵바지',     price:60,  color:'#5B7FA6', icon:'🦺' },

  { id:'bot_shorts',  slot:'bottom',  name:'반바지',       price:20,  color:'#85B7EB', icon:'🩳' },
  { id:'bot_jeans',   slot:'bottom',  name:'청바지',       price:35,  color:'#4A6FA5', icon:'👖' },
  { id:'bot_skirt',   slot:'bottom',  name:'치마',         price:35,  color:'#FFB3D9', icon:'👗' },

  { id:'bg_lavender', slot:'bg',      name:'라벤더 그라디언트', price:10, color:'#EDE0F5', color2:'#FFFFFF', icon:'🟣' },
  { id:'bg_peach',    slot:'bg',      name:'살구 그라디언트',   price:10, color:'#FFE4D4', color2:'#FFF8F2', icon:'🟠' },
  { id:'bg_night',    slot:'bg',      name:'별이 빛나는 밤',    price:80, color:'#2E2A38', color2:'#4A3B5C', icon:'🌌' },

  { id:'fx_sparkle',  slot:'effect',  name:'반짝임',  price:50, emoji:'✨', icon:'✨' },
  { id:'fx_hearts',   slot:'effect',  name:'하트 뿅뿅', price:50, emoji:'💕', icon:'💕' },
  { id:'fx_rainbow',  slot:'effect',  name:'무지개',  price:90, emoji:'🌈', icon:'🌈' },
];
const byId = id => ITEMS.find(i => i.id === id);
const itemsOf = slot => ITEMS.filter(i => i.slot === slot);

const TOPCOLORS = ['#EDE0F5', '#FFE4D4', '#C9E8D4', '#FFD1DC'];

/* URL(?variant=&tab=) 복원 — skill의 ?variant= 관례 그대로 적용 */
(function restoreFromURL(){
  const p = new URLSearchParams(location.search);
  if (['round','chubby','baby'].includes(p.get('variant'))) STATE.variant = p.get('variant');
  if (['shop','dress','compare'].includes(p.get('tab'))) STATE.tab = p.get('tab');
})();
function syncURL() {
  const p = new URLSearchParams(location.search);
  p.set('variant', STATE.variant);
  p.set('tab', STATE.tab);
  history.replaceState(null, '', '?' + p.toString());
}

/* ============================================================
   햄스터 — 벡터(SVG), 3가지 귀여움 방향 변형.
   모든 아이템은 getAnchors()가 계산한 기준점(머리/볼/눈/귀/앞발/뒷발)을
   참조한다 — headR(머리 반지름)에 대한 비율로 전부 계산해서, 변형마다
   머리 크기가 달라도 모자·안경·장갑·신발이 항상 제자리에 붙는다.
   ============================================================ */
const SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function shade(hex, pct) {
  // pct>0: 밝게, pct<0: 어둡게. 털색 파라미터(STATE.furColor)로부터
  // 배/하이라이트/그림자 톤을 자동으로 유도할 때 씀.
  const n = parseInt(hex.slice(1), 16);
  let r = (n>>16)&255, g=(n>>8)&255, b=n&255;
  const t = pct < 0 ? 0 : 255, p = Math.abs(pct)/100;
  r = Math.round((t-r)*p)+r; g = Math.round((t-g)*p)+g; b = Math.round((t-b)*p)+b;
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}
function starPoints(cx, cy, rOuter, rInner, n) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 === 0 ? rOuter : rInner;
    const a = (Math.PI / n) * i - Math.PI / 2;
    pts.push(`${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`);
  }
  return pts.join(' ');
}

// ── 3종 변형 설정 — 이 몇 개 숫자만 바뀌고, 좌표 "공식"은 전부 공유 ──
const VARIANT_META = {
  round:  { label:'동글이',    sub:'기본형 · 동글동글' },
  chubby: { label:'볼빵빵이',  sub:'볼주머니 강조' },
  baby:   { label:'아기눈이',  sub:'눈 크고 아기자기' },
};
const VARIANT_SHAPE = {
  round:  { headR:27, bodyRx:19, bodyRy:17, cheekMul:1.00, eyeMul:1.00, furBase:'#F3DDBB' },
  chubby: { headR:26, bodyRx:18, bodyRy:16, cheekMul:1.45, eyeMul:0.82, furBase:'#F0D4A8' },
  baby:   { headR:30, bodyRx:15, bodyRy:13, cheekMul:0.78, eyeMul:1.40, furBase:'#F7E2C2' },
};
const VARIANTS = ['round', 'chubby', 'baby'];

// ── 앵커(기준점) 계산 — 전부 headR 비율. 아이템은 이 값만 참조한다 ──
function getAnchors(variantKey) {
  const v = VARIANT_SHAPE[variantKey];
  const hx = 50, hy = 36;          // 머리 중심
  const bx = 50, by = 76;          // 몸통 중심
  const hr = v.headR;
  const furBase = STATE.furColor || v.furBase;

  const earDx = hr * 0.80, earCy = hy - hr * 0.64, earRad = hr * 0.40;
  const cheekDx = hr * 0.88, cheekCy = hy + hr * 0.33, cheekRad = hr * 0.30 * v.cheekMul;
  const eyeDx = hr * 0.40, eyeCy = hy + hr * 0.04, eyeRad = hr * 0.17 * v.eyeMul;

  return {
    v, hx, hy, hr, bx, by,
    bodyRx: v.bodyRx, bodyRy: v.bodyRy,
    bodyTop: by - v.bodyRy, bodyBottom: by + v.bodyRy,
    ear:   { rad: earRad,   l:{cx:hx-earDx, cy:earCy},   r:{cx:hx+earDx, cy:earCy} },
    cheek: { rad: cheekRad, l:{cx:hx-cheekDx, cy:cheekCy}, r:{cx:hx+cheekDx, cy:cheekCy} },
    eye:   { rad: eyeRad,   l:{cx:hx-eyeDx, cy:eyeCy},   r:{cx:hx+eyeDx, cy:eyeCy} },
    noseY: hy + hr*0.47, mouthY: hy + hr*0.58,
    paw:  { l:{cx:bx - v.bodyRx*0.62, cy:by - v.bodyRy*0.86}, r:{cx:bx + v.bodyRx*0.62, cy:by - v.bodyRy*0.86} },
    foot: { l:{cx:bx - v.bodyRx*0.55, cy:by + v.bodyRy*0.92}, r:{cx:bx + v.bodyRx*0.55, cy:by + v.bodyRy*0.92} },
    tail: { cx:bx + v.bodyRx*0.96, cy:by - v.bodyRy*0.05 },
    furBase, furLight: shade(furBase, 22), furDark: shade(furBase, -14),
    belly: shade(furBase, 46),
  };
}

let uidCounter = 0;

function buildVectorHamster(eq, variantKey) {
  const uid = 'u' + (uidCounter++);
  const a = getAnchors(variantKey);
  const svg = svgEl('svg', { viewBox: '0 0 100 100', width: '100%', height: '100%' });
  const defs = svgEl('defs', {});
  svg.appendChild(defs); // 배경 유무와 무관하게 항상 먼저 — url(#...) 참조가 전부 여기로 간다

  // ── 배경 ──
  const bg = eq.bg && byId(eq.bg);
  if (bg && bg.id !== 'bg_night') {
    const gradId = 'bg' + uid;
    const grad = svgEl('linearGradient', { id: gradId, x1:'0', y1:'0', x2:'0', y2:'1' });
    grad.appendChild(svgEl('stop', { offset:'0%', 'stop-color': bg.color }));
    grad.appendChild(svgEl('stop', { offset:'100%', 'stop-color': bg.color2 || '#fff' }));
    defs.appendChild(grad);
    svg.appendChild(svgEl('rect', { x:0, y:0, width:100, height:100, fill:`url(#${gradId})` }));
  } else if (bg && bg.id === 'bg_night') {
    svg.appendChild(svgEl('rect', { x:0, y:0, width:100, height:100, fill: bg.color }));
    [[12,15],[82,22],[20,60],[75,70],[8,80],[90,48],[45,10]].forEach(([x,y]) => {
      svg.appendChild(svgEl('circle', { cx:x, cy:y, r:0.9, fill:'#fff', opacity:0.9 }));
    });
  } else {
    svg.appendChild(svgEl('rect', { x:0, y:0, width:100, height:100, fill:'#FFF8F2' }));
  }

  // 바닥 그림자 — 숨쉬기 그룹 밖(캐릭터가 들썩여도 그림자는 고정)
  svg.appendChild(svgEl('ellipse', { cx:50, cy:97, rx:a.bodyRx*1.3, ry:3.2, fill:'rgba(61,31,0,0.10)' }));

  // 몸통/얼굴 전체를 담는 "숨쉬기" 그룹, 그 안에 탭 반응 그룹을 중첩
  const breatheG = svgEl('g', { class:'hm-breathe' });
  breatheG.style.setProperty('--blink-delay', (Math.random()*2).toFixed(2) + 's');
  const g = svgEl('g', { class:'hm-bounce-target', 'data-tap-target':'1' });
  breatheG.appendChild(g);
  svg.appendChild(breatheG);

  // 입체감용 그라디언트 (몸통/머리 공용)
  const bodyGradId = 'bgrad' + uid;
  const bodyGrad = svgEl('radialGradient', { id:bodyGradId, cx:'38%', cy:'30%', r:'75%' });
  bodyGrad.appendChild(svgEl('stop', { offset:'0%', 'stop-color': a.furLight }));
  bodyGrad.appendChild(svgEl('stop', { offset:'65%', 'stop-color': a.furBase }));
  bodyGrad.appendChild(svgEl('stop', { offset:'100%', 'stop-color': a.furDark }));
  defs.appendChild(bodyGrad);
  const furFill = `url(#${bodyGradId})`;

  // ── 꼬리 (몸통보다 먼저 — 뒤로 살짝 보이게) ──
  g.appendChild(svgEl('ellipse', { cx:a.tail.cx, cy:a.tail.cy, rx:a.hr*0.14, ry:a.hr*0.11, fill:a.furLight }));

  // ── 뒷발 (짧게, 몸통 아래서 살짝 나옴) ──
  [a.foot.l, a.foot.r].forEach(p => {
    g.appendChild(svgEl('ellipse', { cx:p.cx, cy:p.cy, rx:a.hr*0.26, ry:a.hr*0.16, fill:a.furDark }));
  });

  // ── 몸통 + 배(밝은 털) ──
  const bodyClipId = 'body' + uid;
  defs.appendChild(svgEl('clipPath', { id: bodyClipId })).appendChild(
    svgEl('ellipse', { cx:a.bx, cy:a.by, rx:a.bodyRx, ry:a.bodyRy })
  );
  g.appendChild(svgEl('ellipse', { cx:a.bx, cy:a.by, rx:a.bodyRx, ry:a.bodyRy, fill:furFill }));
  g.appendChild(svgEl('ellipse', { cx:a.bx, cy:a.by + a.bodyRy*0.22, rx:a.bodyRx*0.62, ry:a.bodyRy*0.62, fill:a.belly, opacity:0.9 }));

  // ── 바지(하의) → 티셔츠(상의) 순, 둘 다 몸통 모양으로 클립 ──
  const bottom = eq.bottom && byId(eq.bottom);
  if (bottom) g.appendChild(svgEl('rect', { x:a.bx-a.bodyRx, y:a.by, width:a.bodyRx*2, height:a.bodyRy*1.3, fill: bottom.color, 'clip-path':`url(#${bodyClipId})` }));
  const top = eq.top && byId(eq.top);
  if (top) {
    const c = (top.colorable && eq.topColor) ? eq.topColor : top.color;
    g.appendChild(svgEl('rect', { x:a.bx-a.bodyRx, y:a.bodyTop-2, width:a.bodyRx*2, height:a.by-a.bodyTop+2, rx:a.hr*0.15, fill:c, 'clip-path':`url(#${bodyClipId})` }));
  }

  // ── 귀(뒷부분 — 머리가 나중에 덮어서 밑동이 자연스럽게 가려짐) ──
  [a.ear.l, a.ear.r].forEach(p => {
    g.appendChild(svgEl('ellipse', { cx:p.cx, cy:p.cy, rx:a.ear.rad, ry:a.ear.rad*1.08, fill:a.furBase }));
    g.appendChild(svgEl('ellipse', { cx:p.cx, cy:p.cy, rx:a.ear.rad*0.52, ry:a.ear.rad*0.58, fill:'#FFC9D6' }));
  });

  // ── 머리 (몸통/옷/귀밑동을 전부 위에서 덮어써서, "상의가 얼굴을 덮는"
  //     문제가 좌표를 아무리 틀어도 구조적으로 재발하지 않게 함) ──
  g.appendChild(svgEl('ellipse', { cx:a.hx, cy:a.hy, rx:a.hr, ry:a.hr*0.96, fill:furFill }));

  // ── 볼주머니(햄스터의 상징) — 머리 위, 눈보다 아래 ──
  [a.cheek.l, a.cheek.r].forEach(p => {
    g.appendChild(svgEl('ellipse', { cx:p.cx, cy:p.cy, rx:a.cheek.rad, ry:a.cheek.rad*0.92, fill:a.furLight }));
  });
  // 볼터치(블러셔) — 볼주머니 위, 살짝 바깥쪽
  [a.cheek.l, a.cheek.r].forEach(p => {
    g.appendChild(svgEl('circle', { cx:p.cx, cy:p.cy+a.cheek.rad*0.1, r:a.cheek.rad*0.52, fill:'#FFB3C1', opacity:0.55 }));
  });

  // ── 눈 (깜빡임 애니메이션 대상) + 하이라이트 ──
  [a.eye.l, a.eye.r].forEach(p => {
    const eyeG = svgEl('g', { class:'hm-eye' });
    eyeG.appendChild(svgEl('circle', { cx:p.cx, cy:p.cy, r:a.eye.rad, fill:'#3D1F00' }));
    eyeG.appendChild(svgEl('circle', { cx:p.cx - a.eye.rad*0.32, cy:p.cy - a.eye.rad*0.38, r:a.eye.rad*0.34, fill:'#ffffff' }));
    eyeG.appendChild(svgEl('circle', { cx:p.cx + a.eye.rad*0.28, cy:p.cy + a.eye.rad*0.30, r:a.eye.rad*0.16, fill:'#ffffff', opacity:0.75 }));
    g.appendChild(eyeG);
  });

  // ── 코 + 입(ω) + 수염 ──
  g.appendChild(svgEl('ellipse', { cx:a.hx, cy:a.noseY, rx:a.hr*0.11, ry:a.hr*0.08, fill:'#E8630A' }));
  g.appendChild(svgEl('path', {
    d:`M ${a.hx-a.hr*0.09} ${a.mouthY-a.hr*0.02} Q ${a.hx-a.hr*0.05} ${a.mouthY+a.hr*0.07} ${a.hx} ${a.mouthY-a.hr*0.015} Q ${a.hx+a.hr*0.05} ${a.mouthY+a.hr*0.07} ${a.hx+a.hr*0.09} ${a.mouthY-a.hr*0.02}`,
    fill:'none', stroke:'#3D1F00', 'stroke-width': a.hr*0.025, 'stroke-linecap':'round',
  }));
  [-1, 1].forEach(side => {
    [-1, 0, 1].forEach(i => {
      const x0 = a.hx + side*a.hr*0.16, y0 = a.noseY + i*a.hr*0.06;
      g.appendChild(svgEl('line', {
        x1:x0, y1:y0, x2: x0 + side*a.hr*0.30, y2: y0 + i*a.hr*0.05,
        stroke:'#D9A066', 'stroke-width':a.hr*0.012, 'stroke-linecap':'round', opacity:0.75,
      }));
    });
  });

  // ── 앞발 (가슴 앞에 모은 포즈 — 머리/얼굴보다 나중에 그려서 앞으로 나옴) ──
  [a.paw.l, a.paw.r].forEach(p => {
    g.appendChild(svgEl('ellipse', { cx:p.cx, cy:p.cy, rx:a.hr*0.20, ry:a.hr*0.17, fill:furFill }));
  });

  // ── 슬롯 아이템 (전부 앵커 기준) ──
  const glasses = eq.glasses && byId(eq.glasses);
  if (glasses) drawGlasses(g, glasses, a);

  const hat = eq.hat && byId(eq.hat);
  if (hat) drawHat(g, defs, hat, a, uid);

  const gloves = eq.gloves && byId(eq.gloves);
  if (gloves) [a.paw.l, a.paw.r].forEach(p => g.appendChild(svgEl('circle', { cx:p.cx, cy:p.cy, r:a.hr*0.24, fill:gloves.color })));

  const shoes = eq.shoes && byId(eq.shoes);
  if (shoes) [a.foot.l, a.foot.r].forEach(p => g.appendChild(svgEl('ellipse', { cx:p.cx, cy:p.cy+a.hr*0.02, rx:a.hr*0.30, ry:a.hr*0.19, fill:shoes.color })));

  return svg;
}

function drawGlasses(g, glasses, a) {
  const { l, r, rad } = a.eye;
  if (glasses.id === 'gl_heart') {
    [l, r].forEach(pt => {
      const s = rad * 1.35;
      g.appendChild(svgEl('path', {
        d:`M ${pt.cx-s} ${pt.cy-s*0.15} C ${pt.cx-s} ${pt.cy-s*0.85}, ${pt.cx} ${pt.cy-s*0.85}, ${pt.cx} ${pt.cy-s*0.15}
           C ${pt.cx} ${pt.cy-s*0.85}, ${pt.cx+s} ${pt.cy-s*0.85}, ${pt.cx+s} ${pt.cy-s*0.15}
           C ${pt.cx+s} ${pt.cy+s*0.55}, ${pt.cx} ${pt.cy+s*0.95}, ${pt.cx} ${pt.cy+s*0.95}
           C ${pt.cx} ${pt.cy+s*0.95}, ${pt.cx-s} ${pt.cy+s*0.55}, ${pt.cx-s} ${pt.cy-s*0.15} Z`,
        fill: glasses.color,
      }));
    });
  } else if (glasses.id === 'gl_star') {
    [l, r].forEach(pt => g.appendChild(svgEl('polygon', {
      points: starPoints(pt.cx, pt.cy, rad*1.55, rad*0.62, 5), fill: glasses.color,
    })));
  } else {
    [l, r].forEach(pt => g.appendChild(svgEl('rect', {
      x:pt.cx-rad*1.35, y:pt.cy-rad*1.1, width:rad*2.7, height:rad*2.0, rx:rad*0.8,
      fill:'none', stroke:glasses.color, 'stroke-width':Math.max(1.2, rad*0.42),
    })));
    g.appendChild(svgEl('line', {
      x1:l.cx+rad*1.35, y1:l.cy, x2:r.cx-rad*1.35, y2:r.cy,
      stroke:glasses.color, 'stroke-width':Math.max(1.2, rad*0.38),
    }));
  }
}

function drawHat(g, defs, hat, a, uid) {
  const hx = a.hx, hy = a.hy, hr = a.hr;
  if (hat.id === 'hat_cap') {
    const domeCy = hy - hr*0.60, domeRx = hr*0.62, domeRy = hr*0.52;
    const clipId = 'cap' + uid;
    defs.appendChild(svgEl('clipPath', { id:clipId })).appendChild(
      svgEl('rect', { x:hx-hr*1.15, y:hy-hr*1.35, width:hr*2.3, height:hr*0.82 })
    );
    g.appendChild(svgEl('ellipse', { cx:hx, cy:domeCy, rx:domeRx, ry:domeRy, fill:hat.color, 'clip-path':`url(#${clipId})` }));
    g.appendChild(svgEl('ellipse', { cx:hx+hr*0.50, cy:domeCy+hr*0.03, rx:hr*0.27, ry:hr*0.10, fill:hat.accent }));
  } else if (hat.id === 'hat_crown') {
    const pts = [
      [hx-hr*0.80, hy-hr*0.20], [hx-hr*0.80, hy-hr*0.80], [hx-hr*0.43, hy-hr*0.46],
      [hx, hy-hr*1.02], [hx+hr*0.43, hy-hr*0.46], [hx+hr*0.80, hy-hr*0.80], [hx+hr*0.80, hy-hr*0.20],
    ];
    g.appendChild(svgEl('polygon', { points: pts.map(p=>p.join(',')).join(' '), fill:hat.color }));
    g.appendChild(svgEl('circle', { cx:hx, cy:hy-hr*0.87, r:hr*0.11, fill:hat.accent }));
  } else if (hat.id === 'hat_ribbon') {
    g.appendChild(svgEl('path', {
      d:`M ${hx-hr*0.86} ${hy-hr*0.34} A ${hr*0.86} ${hr*0.58} 0 0 1 ${hx+hr*0.86} ${hy-hr*0.34} L ${hx+hr*0.86} ${hy-hr*0.12} L ${hx-hr*0.86} ${hy-hr*0.12} Z`,
      fill: hat.color,
    }));
    const bow = svgEl('g', {});
    bow.appendChild(svgEl('path', { d:`M ${hx} ${hy-hr*0.56} L ${hx-hr*0.42} ${hy-hr*0.86} L ${hx-hr*0.42} ${hy-hr*0.34} Z`, fill:hat.accent }));
    bow.appendChild(svgEl('path', { d:`M ${hx} ${hy-hr*0.56} L ${hx+hr*0.42} ${hy-hr*0.86} L ${hx+hr*0.42} ${hy-hr*0.34} Z`, fill:hat.accent }));
    bow.appendChild(svgEl('circle', { cx:hx, cy:hy-hr*0.56, r:hr*0.115, fill:hat.accent }));
    g.appendChild(bow);
  }
}

/* ── 이펙트 레이어 (DOM 오버레이, 캐릭터 그림과 무관하게 공용) ──── */
function buildFxLayer(effectId) {
  const layer = document.createElement('div');
  layer.className = 'fx-layer';
  if (!effectId) return layer;
  const item = byId(effectId);
  if (item.id === 'fx_rainbow') {
    const arc = document.createElement('div');
    arc.className = 'fx-rainbow-arc';
    layer.appendChild(arc);
  }
  const emoji = item.emoji || '✨';
  const count = 6;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span');
    s.className = 'fx-item';
    s.textContent = emoji;
    s.style.left = (8 + (i * 84 / count) + (i % 2 ? 4 : -4)) + '%';
    s.style.animationDelay = (i * 0.32) + 's';
    s.style.fontSize = (0.8 + (i % 3) * 0.25) + 'rem';
    layer.appendChild(s);
  }
  return layer;
}

/* ── 탭(클릭) 반응 — 살아있는 느낌. prefers-reduced-motion은 CSS의
   hmTapJump/hmTapTiny 분기로 처리되므로 여기선 클래스만 토글한다 ──── */
function wireTapReaction(container) {
  container.addEventListener('click', () => {
    const target = container.querySelector('[data-tap-target]');
    if (!target) return;
    target.classList.remove('hm-tap-jump');
    void target.getBoundingClientRect(); // 리플로우 강제 — 애니메이션 재시작 보장
    target.classList.add('hm-tap-jump');
  });
}

/* ── 캐릭터 프리뷰 하나 만들기 (공용) ────────────────────────── */
function renderCharacterInto(container, eq, variantKey, sizePx) {
  container.innerHTML = '';
  container.classList.add('stage-box');
  container.style.width = sizePx + 'px';
  container.style.height = sizePx + 'px';
  const svg = buildVectorHamster(eq, variantKey);
  svg.style.width = sizePx + 'px'; svg.style.height = sizePx + 'px';
  container.appendChild(svg);
  container.appendChild(buildFxLayer(eq.effect));
  wireTapReaction(container);
}

/* ============================================================
   화면 렌더링
   ============================================================ */
const viewEl = document.getElementById('view');
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

function renderTopbar() {
  document.getElementById('coinLabel').textContent = STATE.coins;
  document.getElementById('styleChip').textContent = VARIANT_META[STATE.variant].label;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === STATE.tab));
}

function renderShop() {
  const wrap = document.createElement('div');

  const filters = document.createElement('div');
  filters.className = 'slot-filters';
  const allChip = document.createElement('button');
  allChip.className = 'slot-chip' + (STATE.shopFilter === 'all' ? ' active' : '');
  allChip.textContent = '전체';
  allChip.onclick = () => { STATE.shopFilter = 'all'; render(); };
  filters.appendChild(allChip);
  SLOTS.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'slot-chip' + (STATE.shopFilter === s.key ? ' active' : '');
    chip.textContent = s.icon + ' ' + s.label;
    chip.onclick = () => { STATE.shopFilter = s.key; render(); };
    filters.appendChild(chip);
  });
  wrap.appendChild(filters);

  const grid = document.createElement('div');
  grid.className = 'shop-grid';
  const list = STATE.shopFilter === 'all' ? ITEMS : itemsOf(STATE.shopFilter);
  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'item-card';
    const owned = STATE.owned.has(item.id);

    const swatch = document.createElement('div');
    swatch.className = 'swatch';
    swatch.style.background = item.color ? (item.color + '28') : 'var(--c-lavender)';
    swatch.textContent = item.icon;
    card.appendChild(swatch);

    const name = document.createElement('div');
    name.className = 'name'; name.textContent = item.name;
    card.appendChild(name);

    if (owned) {
      const badge = document.createElement('div');
      badge.className = 'owned-badge'; badge.textContent = '보유중';
      card.appendChild(badge);
      const btn = document.createElement('button');
      btn.className = 'buy-btn'; btn.disabled = true; btn.textContent = '보유중';
      card.appendChild(btn);
    } else {
      const price = document.createElement('div');
      price.className = 'price'; price.textContent = '🪙 ' + item.price;
      card.appendChild(price);
      const btn = document.createElement('button');
      btn.className = 'buy-btn';
      btn.textContent = '구매';
      btn.onclick = () => {
        if (STATE.coins < item.price) { showToast('코인이 부족해요 🥲'); return; }
        STATE.coins -= item.price;
        STATE.owned.add(item.id);
        showToast(item.name + ' 구매 완료! 꾸미기에서 입혀보세요 🎉');
        render();
      };
      card.appendChild(btn);
    }
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

function renderDress() {
  const wrap = document.createElement('div');

  const previewWrap = document.createElement('div');
  previewWrap.className = 'dress-preview-wrap';
  const bgItem = STATE.equipped.bg && byId(STATE.equipped.bg);
  const stageBox = document.createElement('div');
  stageBox.style.background = bgItem ? bgItem.color : '#FBF3EA';
  renderCharacterInto(stageBox, { ...STATE.equipped, topColor: STATE.topColor }, STATE.variant, 190);
  previewWrap.appendChild(stageBox);
  wrap.appendChild(previewWrap);

  const tapHint = document.createElement('div');
  tapHint.className = 'tap-hint';
  tapHint.textContent = '👆 캐릭터를 탭해보세요';
  wrap.appendChild(tapHint);

  const slotTabs = document.createElement('div');
  slotTabs.className = 'slot-tabs';
  SLOTS.forEach(s => {
    const b = document.createElement('button');
    b.className = 'slot-tab' + (STATE.dressSlot === s.key ? ' active' : '');
    b.textContent = s.icon;
    b.title = s.label;
    b.onclick = () => { STATE.dressSlot = s.key; render(); };
    slotTabs.appendChild(b);
  });
  wrap.appendChild(slotTabs);

  const slotLabel = document.createElement('div');
  const curSlot = SLOTS.find(s => s.key === STATE.dressSlot);
  slotLabel.style.cssText = 'font-family:Jua,sans-serif;font-size:0.8rem;color:var(--c-pants);margin-bottom:8px;';
  slotLabel.textContent = curSlot.icon + ' ' + curSlot.label;
  wrap.appendChild(slotLabel);

  const row = document.createElement('div');
  row.className = 'option-row';

  const noneChip = document.createElement('div');
  noneChip.className = 'option-chip' + (!STATE.equipped[STATE.dressSlot] ? ' selected' : '');
  noneChip.innerHTML = `<div class="ring">🚫</div><div class="lbl">없음</div>`;
  noneChip.onclick = () => { STATE.equipped[STATE.dressSlot] = null; render(); };
  row.appendChild(noneChip);

  itemsOf(STATE.dressSlot).forEach(item => {
    const owned = STATE.owned.has(item.id);
    const chip = document.createElement('div');
    chip.className = 'option-chip' + (STATE.equipped[STATE.dressSlot] === item.id ? ' selected' : '') + (!owned ? ' locked' : '');
    chip.innerHTML = `
      <div class="ring">${item.icon}${!owned ? `<span class="lock">🔒</span>` : ''}</div>
      <div class="lbl">${item.name}</div>`;
    chip.onclick = () => {
      if (!owned) { STATE.tab = 'shop'; STATE.shopFilter = item.slot; showToast('상점에서 먼저 구매해주세요'); render(); return; }
      STATE.equipped[STATE.dressSlot] = item.id;
      render();
    };
    row.appendChild(chip);
  });
  wrap.appendChild(row);

  // 색상 파라미터화 데모(티셔츠) — "옷" 탭에서 컬러러블 아이템 장착 중일 때만
  const curTop = STATE.dressSlot === 'top' && STATE.equipped.top && byId(STATE.equipped.top);
  if (curTop && curTop.colorable) {
    const demo = document.createElement('div');
    demo.className = 'color-demo';
    demo.innerHTML = `<div class="ttl">🎨 색만 바꾸면 새 아이템 — 스프라이트 추가 없음</div>`;
    const swatchRow = document.createElement('div');
    swatchRow.className = 'swatch-row';
    TOPCOLORS.forEach(c => {
      const dot = document.createElement('div');
      dot.className = 'color-dot' + (STATE.topColor === c ? ' selected' : '');
      dot.style.background = c;
      dot.onclick = () => { STATE.topColor = c; render(); };
      swatchRow.appendChild(dot);
    });
    demo.appendChild(swatchRow);
    wrap.appendChild(demo);
  }

  // 털색 파라미터 데모 — 모자 탭(첫 탭)에서만 노출해 눈에 띄게.
  // 실제 구현 시엔 이 값이 "상점에서 파는 털색 아이템"의 색상 필드가 됨.
  if (STATE.dressSlot === 'hat') {
    const furDemo = document.createElement('div');
    furDemo.className = 'fur-demo';
    furDemo.innerHTML = `<div class="ttl">🐹 털색(파라미터 미리보기 — 나중에 상점 아이템화 가능)</div>`;
    const swatchRow = document.createElement('div');
    swatchRow.className = 'swatch-row';
    FURCOLORS.forEach(c => {
      const dot = document.createElement('div');
      dot.className = 'color-dot' + (STATE.furColor === c ? ' selected' : '');
      dot.style.background = c || VARIANT_SHAPE[STATE.variant].furBase;
      if (!c) dot.style.boxShadow = 'inset 0 0 0 1px rgba(0,0,0,0.15)';
      dot.title = c ? c : '변형 기본값';
      dot.onclick = () => { STATE.furColor = c; render(); };
      swatchRow.appendChild(dot);
    });
    furDemo.appendChild(swatchRow);
    wrap.appendChild(furDemo);
  }

  return wrap;
}

function renderCompare() {
  const wrap = document.createElement('div');
  const title = document.createElement('div');
  title.style.cssText = 'font-family:Jua,sans-serif;font-size:0.82rem;color:var(--c-pants);margin-bottom:10px;';
  title.textContent = '💜 둘이 어떻게 꾸몄나 구경하기';
  wrap.appendChild(title);

  const presets = [
    { name:'지수 (나)', sub:'Lv.4 · 아기햄찌', eq:{ hat:'hat_ribbon', glasses:'gl_heart', gloves:null, shoes:'sh_pink', top:'top_tee', bottom:'bot_skirt', bg:'bg_lavender', effect:'fx_sparkle' }, topColor:'#FFD1DC' },
    { name:'현하', sub:'Lv.7 · 햄찌', eq:{ hat:'hat_crown', glasses:'gl_star', gloves:'gv_mitt', shoes:'sh_boots', top:'top_hoodie', bottom:'bot_jeans', bg:'bg_peach', effect:'fx_hearts' }, topColor:'#EDE0F5' },
  ];

  const row = document.createElement('div');
  row.className = 'compare-wrap';
  presets.forEach(p => {
    const card = document.createElement('div');
    card.className = 'compare-card';
    const bgItem = p.eq.bg && byId(p.eq.bg);
    const box = document.createElement('div');
    box.style.background = bgItem ? bgItem.color : '#FBF3EA';
    box.style.margin = '0 auto';
    renderCharacterInto(box, { ...p.eq, topColor: p.topColor }, STATE.variant, 140);
    card.appendChild(box);
    const name = document.createElement('div');
    name.className = 'name'; name.textContent = p.name;
    card.appendChild(name);
    const sub = document.createElement('div');
    sub.className = 'sub'; sub.textContent = p.sub;
    card.appendChild(sub);
    row.appendChild(card);
  });
  wrap.appendChild(row);

  const hint = document.createElement('div');
  hint.className = 'hint-box';
  hint.innerHTML = '예시용 더미 룩입니다. 실제 앱에서는 커플 상대의 실시간 장착 상태를 그대로 보여주면 됩니다(지금 다마고치 화면의 두 카드 나란히 배치와 같은 패턴).';
  wrap.appendChild(hint);

  return wrap;
}

function render() {
  renderTopbar();
  viewEl.innerHTML = '';
  if (STATE.tab === 'shop') viewEl.appendChild(renderShop());
  else if (STATE.tab === 'dress') viewEl.appendChild(renderDress());
  else viewEl.appendChild(renderCompare());
  syncURL();
}

/* ── 탭 바인딩 ───────────────────────────────────────────────── */
document.querySelectorAll('.tab-btn').forEach(b => {
  b.onclick = () => { STATE.tab = b.dataset.tab; render(); };
});

/* ── 변형 전환 플로팅 바 (prototype skill 관례: ← 라벨 →, 키보드 지원) ── */
function setVariant(v) { STATE.variant = v; renderSwitcherLabel(); render(); }
function renderSwitcherLabel() {
  const m = VARIANT_META[STATE.variant];
  document.getElementById('switcherLabel').innerHTML = `${m.label}<small>${m.sub}</small>`;
}
document.getElementById('prevStyle').onclick = () => {
  const i = VARIANTS.indexOf(STATE.variant);
  setVariant(VARIANTS[(i - 1 + VARIANTS.length) % VARIANTS.length]);
};
document.getElementById('nextStyle').onclick = () => {
  const i = VARIANTS.indexOf(STATE.variant);
  setVariant(VARIANTS[(i + 1) % VARIANTS.length]);
};
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement?.isContentEditable) return;
  if (e.key === 'ArrowLeft') document.getElementById('prevStyle').click();
  if (e.key === 'ArrowRight') document.getElementById('nextStyle').click();
});

/* ── 초기 렌더 ───────────────────────────────────────────────── */
renderSwitcherLabel();
render();
</script>
</body>
</html>
