<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#7B4FA6">
    <link rel="manifest" href="/manifest.json">
    <!-- 다크모드 — React 마운트 전에 먼저 적용해서 첫 페인트 깜빡임 방지.
         src/hooks/useColorMode.js와 같은 로직(저장된 선택 > 시스템 설정 순). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('colorMode');
          var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia
            && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          if (dark) {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#241F2E');
          }
        } catch (e) {}
      })();
    </script>
    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="부리부리">
    <link rel="apple-touch-icon" href="/icon.svg">
    <!-- 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Hi+Melody&display=swap" rel="stylesheet">
    <title>부리부리 미니홈피</title>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=85c6eebf0a64633248a2ba8c4b687064&libraries=services"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
